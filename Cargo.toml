[package]
name = "gpui-starter"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords = ["gpui", "gui", "desktop", "template"]
description = "A native desktop app starter built with Rust and GPUI."
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
exclude = [
    "CHANGELOG.md",
    "test/*",
    "assets/demo.gif",
    "assets/icon.png",
    "build-aux/*",
    "flatpak/*",
    "icons/*",
    "scripts/*",
    ".github",
]
readme = "./README.md"
build = "build.rs"
rust-version.workspace = true

[[bin]]
name = "gpui-starter"
path = "src/main.rs"

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Andy Hsu <i@nn.ci>"]
categories = ["gui"]
license = "Apache-2.0"
homepage = "https://github.com/xhofe/gpui-starter"
repository = "https://github.com/xhofe/gpui-starter"
documentation = "https://github.com/xhofe/gpui-starter"
rust-version = "1.96.0"

[dependencies]
anyhow = "1.0.104"
arc-swap = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
flate2 = "1.1.9"
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-kit = { workspace = true }
gpui_macros = { workspace = true }
home = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
humansize = "2.1.3"
mimalloc = { version = "0.1.52", optional = true }
os_info = "3.15.0"
rust-embed = { version = "8.12.0", default-features = false, features = [
    "compression",
] }
rust-i18n = "4.2.1"
schemars = "1.2.2"
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = "0.11.0"
serde_json = { workspace = true }
smol = { workspace = true }
sys-locale = "0.3.2"
tempfile = { workspace = true }
time = "0.3.55"
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["local-time"] }
tracing-appender = "0.2.5"
uuid = { workspace = true }
gpui-starter-db = { path = "crates/gpui-starter-db" }
gpui-starter-ui = { path = "crates/gpui-starter-ui" }
snafu = { workspace = true }
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "gzip",
    "socks-proxy",
] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.24.1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[workspace.dependencies]
indexmap = "2.14.0"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
arc-swap = "1.9.2"
chrono = "0.4.45"
directories = "6.0.0"
home = "0.5.12"
redb = "4.2.0"
semver = "1.0.28"
smol = "2.0.2"
snafu = "0.9.2"
tempfile = "3.27.0"
toml = "1.1.4"
tracing = "0.1.44"
uuid = { version = "1.24.1", features = ["v7"] }
gpui = { package = "gpui-pre", version = "0.3.3" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.3", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui_macros = { package = "gpui-pre-macros", version = "0.3.3" }
gpui-kit = { version = "0.6.0" }

[build-dependencies]
winres = "0.1.12"
vergen = { version = "10", features = ["build"] }
vergen-git2 = "10"
toml = "0.9.10"

[package.metadata.cargo-machete]
ignored = ["gpui_macros"]

[lints.clippy]
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

[profile.release.package.exr]
opt-level = "s"
[profile.release.package.gif]
opt-level = "s"
[profile.release.package.image]
opt-level = "s"
[profile.release.package.image-webp]
opt-level = "s"
[profile.release.package.png]
opt-level = "s"
[profile.release.package.qoi]
opt-level = "s"
[profile.release.package.tiff]
opt-level = "s"
[profile.release.package.zune-jpeg]
opt-level = "s"
[profile.release.package.zune-core]
opt-level = "s"
[profile.release.package.fdeflate]
opt-level = "s"
[profile.release.package.usvg]
opt-level = "s"
[profile.release.package.resvg]
opt-level = "s"
[profile.release.package.tiny-skia]
opt-level = "s"
[profile.release.package.svgtypes]
opt-level = "s"

[features]
default = []
mimalloc = ["dep:mimalloc"]

[package.metadata.bundle]
name = "GPUI Starter"
identifier = "com.example.gpui-starter"
icon = ["icons/gpui-starter.icns"]
copyright = "Copyright © 2026 Andy Hsu. All rights reserved."
category = "public.app-category.developer-tools"
osx_minimum_system_version = "12.0"
short_description = "A native desktop app starter written in Rust and GPUI."

[package.metadata.winres]
OriginalFilename = "gpui-starter.exe"
LegalCopyright = "Copyright © 2026 Andy Hsu. All rights reserved."

[package.metadata.appimage]
assets = ["assets/gpui-starter.desktop", "assets/icon.png", "icons/gpui-starter-icon.svg"]
icon = "assets/icon.png"
desktop_entry = "assets/gpui-starter.desktop"

[package.metadata.deb]
name = "gpui-starter"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """A native, GPU-accelerated desktop app starter built in Rust with GPUI \
(the Zed editor's UI framework). Clone, run ./scripts/init.sh my-app, and start building."""
assets = [
    ["target/release/gpui-starter", "usr/bin/", "755"],
    ["assets/gpui-starter.desktop", "usr/share/applications/gpui-starter.desktop", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/512x512/apps/gpui-starter.png", "644"],
    ["icons/gpui-starter-icon.svg", "usr/share/icons/hicolor/scalable/apps/gpui-starter.svg", "644"],
]

[package.metadata.generate-rpm]
name = "gpui-starter"
assets = [
    { source = "target/release/gpui-starter", dest = "/usr/bin/gpui-starter", mode = "755" },
    { source = "assets/gpui-starter.desktop", dest = "/usr/share/applications/gpui-starter.desktop", mode = "644" },
    { source = "assets/icon.png", dest = "/usr/share/icons/hicolor/512x512/apps/gpui-starter.png", mode = "644" },
    { source = "icons/gpui-starter-icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/gpui-starter.svg", mode = "644" },
]
